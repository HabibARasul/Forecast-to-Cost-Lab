<script id="engine-src">// Reimplementation engine for "Benchmarking Conventional and AI-Driven Approaches for Joint

    const out = {}; policies.forEach((p) => out[p] = { fill: [], holding: [], orders: [], balance: 0, pipe: 0 });
    for (let k = 0; k < reps; k++) for (const p of policies) { let dem = 0, fil = 0, hold = 0, ord = 0;
      top.forEach((row, j) => { const it = model.items.find((x) => x.item === row.item); const s = simulateItem(row, it, model, p, { seed: (set.seed + 1) * 1000003 + k * 7919 + j * 31 });

      out[p].fill.push(dem ? fil / dem : 1); out[p].holding.push(hold); out[p].orders.push(ord); }

  }

  }

<script id="suite-src">// Validation suite for the Forecast-to-Cost Lab. Categories: exact (closed form), bound (statistical or inequality),

      return { ok: near(ratio, 1.25, 1e-12) && near(s.separate.total, 250, 1e-9) && near(s.full_joint.total, 200, 1e-9), got: `ratio ${ratio.toFixed(12)}, ${s.separate.total} vs ${s.full_joint.total}`, want: 'ratio 1.25, 250 vs 200' }; } },

      return { ok: Math.round(t.separate.total) === 367684 && Math.round(t.thesis_joint.total) === 355822 && r.cost.savings.thesis_joint.toFixed(2) === '3.23', got: `${Math.round(t.separate.total)} / ${Math.round(t.thesis_joint.total)} / ${r.cost.savings.thesis_joint.toFixed(2)}%`, want: '367684 / 355822 / 3.23%' }; } },
    { id: 'X4', cat: 'exact', name: 'Full joint optimum equals the closed form K = S + F + d·r (all 1,443 pairs)', src: 'EOQ identity', run() { const r = L.runModel(ex('thesis'), { forecast: false }); let mx = 0;
      r.cost.rows.forEach((row) => { const H = 0.2 * Math.max(row.price, 1); const K = 15 + 2 + row.dist * 0.015; mx = Math.max(mx, Math.abs(row.full_joint.total - Math.sqrt(2 * row.D * K * H))); });

    { id: 'X5', cat: 'exact', name: 'Truckload piecewise optimum equals a 0.01-unit grid search', src: 'Piecewise EOQ', run() { const r = L.runModel(ex('truckload'), { forecast: false }); const set = r.model.settings; let worst = 0;

        for (const m of r.model.modes) for (let q = 1; q <= 20000; q += 0.5) { const c = L.costAt(inp, m, q, set, row.dist); if (c.total < best.total) best = c; }

    const ctl = panel('Scenarios', 'Each scenario edits table cells, compiles the edited model (errors are reported by scenario row) and runs all three policies. The base case is the model as written.', `<div class="controls"><button class="btn primary" id="runScen">Run ${m.scenarios.length} scenarios</button><span class="progress" id="prog">${esc(S.progress)}</span></div>` + table(['Scenario', 'Changes'], m.scenarios.map((s) => [esc(s), S.comp.parsed.scenarios.rows.filter((r) => r.scenario === s).map((r) => `${esc(r.table)}.${esc(r.key)}.${esc(r.column)} = ${esc(r.value)}`).join('<br>')])));

    return `${ctl}${panel('Results', 'Savings are relative to the separate policy within each scenario.', table(['Scenario', 'Separate', 'Thesis joint', 'Saving', 'Full joint', 'Saving', 'Full-joint modes'], rows.map((r) => r.err ? [esc(r.name), `<span class="pill differs">Error</span> ${esc(r.err)}`, '', '', '', '', ''] : [esc(r.name), usd(r.c.tot.separate.total), usd(r.c.tot.thesis_joint.total), f2(r.c.savings.thesis_joint) + '%', usd(r.c.tot.full_joint.total), f2(r.c.savings.full_joint) + '%', esc(Object.entries(r.c.tot.full_joint.modes).map(([k, v]) => k + ' ' + v).join(', '))]), [1, 2, 3, 4, 5]) + `<div class="controls"><button class="btn" id="copyScen">Copy as CSV</button></div>`)}
      ${panel('Savings by scenario', '', barChart({ cats: rows.filter((r) => !r.err).map((r) => r.name), series: [{ name: 'Thesis joint rule', values: rows.filter((r) => !r.err).map((r) => r.c.savings.thesis_joint), color: 'var(--joint)' }, { name: 'Full joint optimum', values: rows.filter((r) => !r.err).map((r) => r.c.savings.full_joint), color: 'var(--accent)' }], yLabel: 'Saving vs separate (%)', labels: true, fmt: (v) => f1(v) + '%' }))}`;
  }
  async function runScenarios() { const m = S.comp.model; S.busy = true; const out = [{ name: 'Base case', c: L.runCostModel(m, S.fc) }];
    for (const s of m.scenarios) { setProg('Running ' + s + '…'); await new Promise((r) => setTimeout(r, 10)); const C = L.compile(S.tables, s); if (!C.ok) { out.push({ name: s, err: C.errors.map((e) => `${e.table} line ${e.line}: ${e.msg}`).join('; ') }); continue; }
      let fc = null; if (C.model.settings.demand_from === 'forecast') { fc = await inWorker('fc', { tables: S.tables, scenario: s }, (p) => setProg(s + ': ' + p)); } out.push({ name: s, c: L.runCostModel(C.model, fc) }); }
    S.scen = out; S.busy = false; S.progress = ''; render(); }
  function rValidate() {
    const ctl = panel('Validation suite', 'Runs every check in the browser: exact closed-form results, statistical bounds, a published value from the thesis, known approximations (gaps reported, not failed) and conservation laws on every example model.',
      `<div class="controls"><button class="btn primary" id="runSuite">Run validation suite</button><span class="progress" id="prog">${esc(S.progress || (S.suite ? '' : 'About 15 seconds.'))}</span></div>`);
    if (!S.suite) return ctl; const R = S.suite; const cats = [['exact', 'Exact results'], ['published', 'Published values'], ['bound', 'Bounds'], ['approx', 'Approximations (gap, not a failure)'], ['conservation', 'Conservation laws on every example']];
    const tiles = `<div class="stats">${cats.map(([k, n]) => { const xs = R.filter((r) => r.cat === k); const ok = xs.filter((r) => r.ok).length; return `<div class="stat" style="border-color:${ok === xs.length ? 'var(--ok)' : 'var(--bad)'}"><b>${k === 'approx' ? xs.length : ok + ' / ' + xs.length}</b><span>${n}</span></div>`; }).join('')}</div>`;
    return ctl + tiles + cats.map(([k, n]) => panel(n, '', table(['ID', 'Check', 'Source', 'Result', 'Expected', ''], R.filter((r) => r.cat === k).map((r) => [esc(r.id), esc(r.name), esc(r.src || ''), esc(r.got || ''), esc(r.want || ''), r.gap ? '<span class="pill within">Gap</span>' : r.ok ? '<span class="pill match">Pass</span>' : '<span class="pill differs">Fail</span>'])))).join('');
  }

  // ---------- help and tour ----------
  const HELP = `<h2>Help</h2><p>The Forecast-to-Cost Lab generalizes the thesis <i>Benchmarking Conventional and AI-Driven Approaches for Joint Transportation–Inventory Optimization in Retail</i>. The thesis is one saved model; any other system can be written as CSV tables.</p>
    <h3>Getting started</h3><ol><li>Pick an example in <b>Examples</b>. It loads and runs.</li><li>Open <b>Costs and modes</b> to compare the separate policy, the thesis joint rule and the full joint optimum.</li><li>Edit any table in <b>Model</b>; errors appear by line as you type. Press <b>Run model</b> (R).</li><li>Use <b>Scenarios</b> for what-if runs and <b>Validation</b> to check the engine.</li></ol>
    <h3>Tables</h3><ul><li><b>settings</b>: key,value rows. See the column card in the Model tab for every key and default.</li><li><b>modes</b>: mode, fixed_cost, per_km, per_unit, transit_days, capacity. A shipment of Q units costs ceil(Q/capacity) × (fixed_cost + distance × per_km) + per_unit × Q.</li><li><b>items</b>: item, price, annual_demand, distance_km, series, weekly_sd, lead_days, ordering_cost, holding_rate, demand_dist, allowed_modes.</li><li><b>series</b>: series, period, value (long form).</li><li><b>generators</b>: synthetic series from const, iid, ar1, rw, trend, seasonal or intermittent models.</li><li><b>scenarios</b>: scenario, table, key, column, value. Key * changes every row; value x1.3 multiplies.</li></ul>
    <h3>Distributions</h3><p>const(a), exp(mean), uni(a, b), tri(min, mode, max), norm(mean, sd), lnorm(μ, σ), erl(k, mean), gamma(shape, scale), pois(mean), emp(v1, v2, …). Commas inside parentheses do not split CSV cells.</p>
    <h3>How the engine works</h3><p><b>Policies.</b> Separate: Q = √(2DS/H) on the base mode, shipping added afterwards (the thesis conventional model). Thesis joint: Q = √(2D(S+F)/H) for each mode, cheapest mode kept (the thesis joint model). Full joint: for each mode the exact minimizer of the whole annual cost, solved piece by piece over the number of vehicles per order, then the cheapest mode.</p>
    <p><b>Annual cost</b> = (D/Q)·S + (D/Q)·trucks·(F + d·r) + D·u + (Q/2)·H + z·σ·√(L + R)·H + D·(transit/365)·H, where L is supplier lead time plus transit in weeks and z comes from the service level.</p>
    <p><b>Forecasts.</b> Rolling one-step-ahead over the test part of each series. ARIMA uses exact Kalman-filter likelihood; Holt, SES and damped trend minimize squared one-step error; GBT reproduces XGBoost's settings; Croston handles intermittent demand. With demand_from = forecast, the chosen method's mean forecast sets D and its error SD sets σ, which links forecast accuracy to cost.</p>
    <p><b>Simulation.</b> Weekly (r, Q) with backorders. Each replication uses its own random stream per item, shared across policies, so differences between policies are paired.</p>
    <h3>Validation</h3><p><b>Strategy.</b> Check the engine where the answer is known, then check laws that must hold in every model. <b>Acceptance rules:</b> exact checks within 1e-9 (or 5e-9 for the inverse normal); bounds within stated ranges; the published thesis totals to the dollar. <b>Benchmarks:</b> Harris EOQ; the EOQ cost penalty; the thesis totals; the closed form for every thesis pair; truckload pieces against a 0.01-unit grid; Baumol–Vinod against exhaustive search; inverse normal values; Kalman likelihood against a dense Gaussian likelihood; ARIMA(0,1,0) and SES(α=1) against naive; Holt on a line; seasonal naive on a pure cycle; Croston on a regular pattern; a boosted stump; MASE by hand; the constant-demand sawtooth and Little's law for stock in transit; AR(1) recovery; Diebold–Mariano size; random-walk RMSE. <b>Known gaps:</b> fill rate is not cycle service level; small test sets give sampling error. <b>Design choices that aid checking:</b> pure functions, seeded streams, every cost component reported, conservation checks on every run. <b>What the evidence does not cover:</b> real carrier tariffs, multi-echelon networks, capacity shared between items, and lost-sales demand. <b>To validate your own model:</b> start from a benchmark, change one table at a time, and keep the conservation checks green.</p>
    <h3>Keyboard</h3><p><kbd>R</kbd> run model · <kbd>1</kbd>–<kbd>7</kbd> tabs · <kbd>Space</kbd> play or pause the animation · <kbd>S</kbd> step one week · <kbd>T</kbd> tour · <kbd>?</kbd> help · <kbd>Esc</kbd> close</p>
    <h3>Questions</h3><p><b>Why does the full joint policy save so much more than the thesis rule on the thesis data?</b> The thesis rule leaves the distance cost out of the lot size even though it is paid on every shipment.</p><p><b>Is the showcase data real?</b> No. Gulf Coast MRO and Regional grocery are invented examples.</p>
    <h3>References</h3><p>Harris 1913; Baumol and Vinod 1970; Croston 1972; Holt 1957; Box et al. 2015; Hyndman and Athanasopoulos 2021; Hyndman and Koehler 2006; Diebold and Mariano 1995; Harvey, Leybourne and Newbold 1997; Holm 1979; Chen and Guestrin 2016; Little 1961; Acklam 2003; Constante, Silva and Pereira 2019.</p>`;
  const TOUR = [['#tabs', 'The tool has seven areas. Start with Examples; the thesis is the first card.'], ['#runBtn', 'Run model compiles the tables and runs every policy. Shortcut R.'], ['#main .panel', 'Every panel has a ? button with a short explanation.'], ['#helpBtn', 'Help has the table reference, the cost formula and the validation chapter.']];
  function tour(i = 0) { document.querySelectorAll('.tour,.tour-ring').forEach((e) => e.remove()); if (i >= TOUR.length) return; const el = $(TOUR[i][0]); if (!el) return tour(i + 1); const r = el.getBoundingClientRect();
    const ring = document.createElement('div'); ring.className = 'tour-ring'; Object.assign(ring.style, { top: r.top - 4 + 'px', left: r.left - 4 + 'px', width: r.width + 8 + 'px', height: Math.min(r.height, innerHeight - 40) + 8 + 'px' });
    const b = document.createElement('div'); b.className = 'tour'; b.innerHTML = `<span class="eyebrow">Tour ${i + 1} of ${TOUR.length}</span><p>${TOUR[i][1]}</p><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" id="tEnd">End</button><button class="btn primary" id="tNext">${i === TOUR.length - 1 ? 'Finish' : 'Next'}</button></div>`;
    document.body.append(ring, b); b.style.top = (r.bottom + 12 + b.offsetHeight < innerHeight ? r.bottom + 12 : Math.max(8, r.top - b.offsetHeight - 12)) + 'px'; b.style.left = Math.max(8, Math.min(innerWidth - b.offsetWidth - 8, r.left)) + 'px'; $('#tNext').onclick = () => tour(i + 1); $('#tEnd').onclick = () => tour(99); }
  function showTip(btn) { document.querySelectorAll('.pop').forEach((e) => e.remove()); const p = document.createElement('div'); p.className = 'pop'; p.textContent = btn.dataset.tip; document.body.appendChild(p); const r = btn.getBoundingClientRect();
    p.style.top = Math.min(innerHeight - p.offsetHeight - 8, r.bottom + 6) + 'px'; p.style.left = Math.max(8, Math.min(innerWidth - p.offsetWidth - 8, r.left - p.offsetWidth / 2)) + 'px'; }
  const closeLayer = () => { $('#layer').innerHTML = ''; document.querySelectorAll('.pop,.tour,.tour-ring').forEach((e) => e.remove()); };

  // ---------- render ----------
  function render() {
    const nErr = S.comp ? S.comp.errors.length : 0;
    $('#tabs').innerHTML = TABS.map(([k, n], i) => `<button role="tab" data-tab="${k}" aria-selected="${k === S.tab}" title="${n} (${i + 1})">${n}${k === 'model' && nErr ? `<span class="err">${nErr}</span>` : ''}</button>`).join('');
    const fn = { library: rLibrary, model: rModel, forecast: rForecast, cost: rCost, simulate: rSimulate, scenarios: rScenarios, validate: rValidate }[S.tab];
    $('#main').innerHTML = (S.busy && S.tab !== 'forecast' && S.tab !== 'scenarios' && S.tab !== 'validate' ? `<p class="progress" id="prog">${esc(S.progress)}</p>` : '') + fn(); ls.set('tab', S.tab);
    document.documentElement.style.setProperty('--hdr', $('#hdr').offsetHeight + 'px');
    if (S.tab === 'simulate' && S.sim.log) { draw(); if (S.sim.playing) play(true); }
    if (S.tab === 'model') { const ta = $('#code'), gu = $('#gutter'); ta.addEventListener('scroll', () => { gu.scrollTop = ta.scrollTop; }); }
  }
  let tmr = null;
  function onCode(ta) { S.tables[S.active] = ta.value; clearTimeout(tmr); tmr = setTimeout(() => { const pos = ta.selectionStart, sc = ta.scrollTop; recompile(); render(); const t2 = $('#code'); t2.focus(); t2.setSelectionRange(pos, pos); t2.scrollTop = sc; $('#gutter').scrollTop = sc; }, 350); }
  function gotoLine(table, line) { S.tab = 'model'; S.active = table; render(); const ta = $('#code'); const lines = ta.value.split('\n'); const pos = lines.slice(0, Math.max(0, line - 1)).reduce((a, l) => a + l.length + 1, 0); ta.focus(); ta.setSelectionRange(pos, pos + (lines[line - 1] || '').length); ta.scrollTop = Math.max(0, (line - 4) * 20); }

  document.addEventListener('click', async (e) => { const t = e.target.closest('button'); if (e.target.id === 'cv') { const r = e.target.getBoundingClientRect(); const x = e.clientX - r.left, y = e.clientY - r.top; const h = hits.find((k) => x >= k.x && x <= k.x + k.w && y >= k.y && y <= k.y + k.h); S.sim.pick = h && h.type === 'truck' ? h : null; $('#insp').innerHTML = inspectHTML(); return; }
    if (!t) { document.querySelectorAll('.pop').forEach((p) => p.remove()); if (e.target.classList && e.target.classList.contains('drawer')) closeLayer(); return; }
    const id = t.id;
    if (t.dataset.tab) { S.tab = t.dataset.tab; render(); } else if (t.dataset.tip) showTip(t); else if (t.dataset.ex) { loadExample(t.dataset.ex); await runModel(); S.tab = 'cost'; render(); }
    else if (t.dataset.table) { S.active = t.dataset.table; render(); } else if (t.dataset.goto) { const [tb, ln] = t.dataset.goto.split(':'); gotoLine(tb, +ln); }
    else if (id === 'runBtn') runModel(); else if (id === 'helpBtn') { $('#layer').innerHTML = `<div class="drawer" role="dialog" aria-modal="true" aria-label="Help"><div><div style="display:flex;justify-content:flex-end"><button class="btn" id="closeHelp">Close <kbd>Esc</kbd></button></div>${HELP}</div></div>`; $('#closeHelp').focus(); }
    else if (id === 'closeHelp') closeLayer(); else if (id === 'tourBtn') tour(0);
    else if (id === 'themeBtn') { const d = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; document.documentElement.dataset.theme = d ? 'light' : 'dark'; if (S.tab === 'simulate') draw(); }
    else if (id === 'copyTable') copyText(S.tables[S.active], S.active + ' table'); else if (id === 'resetEx') { loadExample(S.ex); render(); }
    else if (id === 'runFc') { S.busy = true; setProg('Starting…'); try { S.fc = await inWorker('fc', { tables: S.tables }, (p) => setProg(p)); S.fcSeries = S.fc.ids[0]; } catch (err) { toast('Forecast run failed: ' + err.message); } S.busy = false; S.progress = ''; render(); }
    else if (id === 'copyCost') { const T = S.res.cost.tot; copyText(csv(['component', ...L.POLICIES], ['ordering', 'fixedShip', 'distanceShip', 'unitFreight', 'cycle', 'safety', 'pipeline', 'total'].map((k) => [k, ...L.POLICIES.map((p) => T[p][k].toFixed(2))])), 'Breakdown'); }
    else if (id === 'copyItems') copyText(csv(['item', 'D', 'price', 'distance_km', 'separate', 'thesis_joint', 'full_joint', 'full_joint_mode', 'full_joint_Q', 'safety_stock'], S.res.cost.rows.map((r) => [r.item, r.D.toFixed(3), r.price, r.dist.toFixed(2), r.separate.total.toFixed(2), r.thesis_joint.total.toFixed(2), r.full_joint.total.toFixed(2), r.full_joint.mode, r.full_joint.Q.toFixed(3), r.full_joint.ss.toFixed(3)])), 'Items');
    else if (id === 'simPlay') play(!S.sim.playing); else if (id === 'simStep') { play(false); S.sim.t = Math.min(S.sim.log.length - 0.001, Math.floor(S.sim.t) + 1); draw(); $('#insp').innerHTML = inspectHTML(); }
    else if (id === 'simEnd') { play(false); S.sim.t = S.sim.log.length - 0.001; draw(); $('#insp').innerHTML = inspectHTML(); } else if (id === 'simReset') { play(false); S.sim.t = 0; S.sim.delays = {}; buildLog(); render(); }
    else if (id === 'simDelay') { const w = Math.floor(S.sim.t); S.sim.delays[w + 1] = (S.sim.delays[w + 1] || 0) + 1; buildLog(); render(); toast('Trucks on the road in week ' + (w + 2) + ' arrive one week late'); }
    else if (id === 'unpick') { S.sim.pick = null; $('#insp').innerHTML = inspectHTML(); }
    else if (id === 'runRepl') { S.busy = true; setProg('Replicating…'); await new Promise((r) => setTimeout(r, 20)); S.repl = L.simulateModel(S.res.model, S.res.cost); S.busy = false; render(); }
    else if (id === 'runScen') runScenarios(); else if (id === 'copyScen') copyText(csv(['scenario', 'separate', 'thesis_joint', 'full_joint', 'saving_thesis_joint_pct', 'saving_full_joint_pct'], S.scen.filter((r) => !r.err).map((r) => [r.name, r.c.tot.separate.total.toFixed(2), r.c.tot.thesis_joint.total.toFixed(2), r.c.tot.full_joint.total.toFixed(2), r.c.savings.thesis_joint.toFixed(4), r.c.savings.full_joint.toFixed(4)])), 'Scenario table');
    else if (id === 'runSuite') { S.busy = true; setProg('Running…'); try { S.suite = await inWorker('suite', {}, (p) => setProg('Checked ' + p)); } catch (err) { toast('Suite failed: ' + err.message); } S.busy = false; S.progress = ''; render(); } });
  document.addEventListener('input', (e) => { if (e.target.id === 'code') onCode(e.target); else if (e.target.id === 'itemQ') { S.itemQ = e.target.value; const p = e.target.selectionStart; render(); const q = $('#itemQ'); q.focus(); q.setSelectionRange(p, p); }
    else if (e.target.id === 'simSpeed') { S.sim.speed = +e.target.value; $('#spdTxt').textContent = 2 ** S.sim.speed / 4 + ' wk/s'; } });
  document.addEventListener('change', (e) => { if (e.target.id === 'fcSel') { S.fcSeries = e.target.value; render(); } else if (e.target.id === 'simItem') { S.sim.item = e.target.value; S.sim.t = 0; S.sim.delays = {}; S.sim.pick = null; buildLog(); render(); } else if (e.target.id === 'simPol') { S.sim.policy = e.target.value; S.sim.t = 0; S.sim.delays = {}; buildLog(); render(); } });
  document.addEventListener('keydown', (e) => { if (e.target.closest('input,select,textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'Escape') closeLayer(); else if (e.key === 'r' || e.key === 'R') runModel(); else if (/^[1-7]$/.test(e.key)) { S.tab = TABS[+e.key - 1][0]; render(); } else if (e.key === '?') $('#helpBtn').click(); else if (e.key === 't' || e.key === 'T') tour(0);
    else if (S.tab === 'simulate' && e.key === ' ') { e.preventDefault(); play(!S.sim.playing); } else if (S.tab === 'simulate' && (e.key === 's' || e.key === 'S')) $('#simStep') && $('#simStep').click(); });
  window.addEventListener('resize', () => { if (S.tab === 'simulate') draw(); });

  // boot: load the saved example and run it so the first view shows results
  loadExample(S.ex); const C0 = S.comp; if (C0.ok && C0.model.settings.demand_from !== 'forecast') { S.res = { model: C0.model, cost: L.runCostModel(C0.model, null) }; prepareSim(); } render();
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) S.sim.speed = 0;
  window.__lab = { S, runModel, render };
})();
</script>
